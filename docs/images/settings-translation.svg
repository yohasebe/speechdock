  <text x="670" y="230.9" font-size="13" font-weight="400" fill="#1d1d1f">日本語</text>
  <g transform="translate(794 220) scale(0.75)" color="#1d1d1f"><path d="M5 6.2L8 3.4l3 2.8M5 9.8L8 12.6l3-2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  <path d="M266 244.5H812" stroke="black" stroke-opacity="0.08"/>
  <text x="266" y="264" font-size="12" font-weight="400" fill="#7a7a7e">Only languages with installed language packs are shown. Install more in System Settings &gt; </text>
  <text x="266" y="279" font-size="12" font-weight="400" fill="#7a7a7e">General &gt; Language &amp; Region &gt; Translation Languages.</text>
  <text x="266" y="324.9" font-size="13" font-weight="700" fill="#1d1d1f">Subtitle Translation</text>
