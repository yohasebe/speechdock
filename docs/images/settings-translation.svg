  <text x="740" y="163.9" font-size="13" font-weight="400" fill="#1d1d1f">macOS</text>
  <path d="M266 177.5H812" stroke="black" stroke-opacity="0.08"/>
  <text x="266" y="197" font-size="12" font-weight="400" fill="#7a7a7e">On-device, ~18 languages</text>
  <path d="M266 208.5H812" stroke="black" stroke-opacity="0.08"/>
  <text x="266" y="230.9" font-size="13" font-weight="400" fill="#1d1d1f">Target Language</text>
