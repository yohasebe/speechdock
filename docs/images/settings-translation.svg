  <text x="266" y="387.9" font-size="13" font-weight="400" fill="#1d1d1f">Enable Real-Time Translation</text>
  <text x="266" y="405" font-size="12" font-weight="400" fill="#7a7a7e">Translate subtitles to target language in real-time.</text>
