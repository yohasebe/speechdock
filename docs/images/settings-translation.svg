  <text x="72" y="351.9" font-size="13" font-weight="400" fill="#1d1d1f">About</text>
  <text x="266" y="68.9" font-size="13" font-weight="700" fill="#1d1d1f">Translation</text>
  <rect x="254" y="80" width="570" height="210" rx="10" fill="#000" fill-opacity="0.035"/>
  <text x="266" y="100" font-size="12" font-weight="400" fill="#7a7a7e">The provider and target language apply to both the panel Translate button and subtitle </text>
  <text x="266" y="115" font-size="12" font-weight="400" fill="#7a7a7e">translation. The model applies to the panel; subtitles use the provider's default model for </text>
  <text x="266" y="130" font-size="12" font-weight="400" fill="#7a7a7e">speed.</text>
  <path d="M266 141.5H812" stroke="black" stroke-opacity="0.08"/>
  <text x="266" y="163.9" font-size="13" font-weight="400" fill="#1d1d1f">Provider</text>
