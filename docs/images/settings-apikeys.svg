  <text x="699" y="309.9" font-size="13" font-weight="400" fill="#1d1d1f" fill-opacity="0.35">Save to Keychain</text>
  <text x="266" y="342" font-size="12" font-weight="400" fill="#7a7a7e">Enables STT (GPT Realtime Whisper, GPT Live Transcribe, GPT Transcribe), TTS (GPT-4o Mini</text>
  <text x="266" y="357" font-size="12" font-weight="400" fill="#7a7a7e">TTS), and translation. Optional — macOS built-in works without this.</text>
