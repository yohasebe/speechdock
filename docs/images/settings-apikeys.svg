  <text x="72" y="351.9" font-size="13" font-weight="400" fill="#1d1d1f">About</text>
  <text x="266" y="68.9" font-size="13" font-weight="700" fill="#1d1d1f">About API Keys</text>
  <rect x="254" y="80" width="570" height="107" rx="10" fill="#000" fill-opacity="0.035"/>
  <text x="266" y="100" font-size="12" font-weight="400" fill="#7a7a7e">SpeechDock works without API keys using macOS built-in STT/TTS. Cloud providers below are</text>
  <text x="266" y="115" font-size="12" font-weight="400" fill="#7a7a7e">optional and offer additional voices, models, and languages.</text>
  <path d="M266 126.5H812" stroke="black" stroke-opacity="0.08"/>
  <text x="266" y="146" font-size="12" font-weight="400" fill="#7a7a7e">Each field takes the key itself or a 1Password reference (op://vault/item/field). A reference is </text>
  <text x="266" y="161" font-size="12" font-weight="400" fill="#7a7a7e">read with the 1Password CLI (op) when Settings opens or a key is first needed; only the </text>
  <text x="266" y="176" font-size="12" font-weight="400" fill="#7a7a7e">reference is stored in the keychain.</text>
  <text x="266" y="221.9" font-size="13" font-weight="700" fill="#1d1d1f">OpenAI</text>
