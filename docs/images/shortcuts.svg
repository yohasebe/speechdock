<svg xmlns="http://www.w3.org/2000/svg" role="img" width="627" height="724" viewBox="0 0 627 724" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans JP', Arial, sans-serif">
  <title>Keyboard Shortcuts</title>
