    <linearGradient id="app-icon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1580f0"/><stop offset="1" stop-color="#3aa0ff"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="627" height="724" rx="0" fill="#e7eaf0"/>
