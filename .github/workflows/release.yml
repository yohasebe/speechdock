name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tracked files match the allow list
        run: ruby scripts/lint/check_tracked_paths.rb

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26.0*.app | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 26.0 installation found on the runner."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Check the tag and the release state
        # A tag must release the version it names, and a published release is
        # never rebuilt: its DMG is what the update feed and the cask point at.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($TAG)."
            exit 1
          fi
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end")
          case "$STATE" in
            "") echo "No release for $TAG yet." ;;
            draft)
              echo "::error::A draft release for $TAG exists. Review and remove it, then run this job again."
              exit 1
              ;;
            *)
              echo "::error::A release for $TAG is already published. Release a new version instead of rebuilding this one."
              exit 1
              ;;
          esac

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install create-dmg and fileicon
        run: brew install create-dmg fileicon

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          # Restrict access to codesign instead of -A (allow any application)
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Create DMG
        run: |
          chmod +x scripts/create-dmg.sh
          ./scripts/create-dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          chmod +x scripts/notarize.sh
          ./scripts/notarize.sh

      - name: Download Sparkle
        # Keep aligned with the Sparkle framework version pinned in project.yml.
        # Used here only for the `sign_update` CLI that produces the EdDSA
        # signature embedded in appcast.xml.
        env:
          SPARKLE_VERSION: "2.10.1"
          SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
        run: |
          curl -fL -o /tmp/Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  /tmp/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/Sparkle
          tar -xf /tmp/Sparkle.tar.xz -C /tmp/Sparkle

      - name: Sign DMG for Sparkle and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # The feed, the release, and the cask all name the DMG by version.
          VERSION=$(cat VERSION)
          DMG_FILE="SpeechDock-${VERSION}.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "::error::Expected $DMG_FILE, found: $(ls SpeechDock-*.dmg 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          DMG_SIZE=$(stat -f%z "$DMG_FILE")
          PUB_DATE=$(date -R)

          # Create temporary file with private key
          # trap ensures the key is removed even if sign_update fails
          SPARKLE_KEY_FILE=$(mktemp /tmp/sparkle_key.XXXXXX)
          trap 'rm -f "$SPARKLE_KEY_FILE"' EXIT
          echo "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"

          # Sign the DMG - extract just the signature value (without attribute name)
          RAW_SIGNATURE=$(/tmp/Sparkle/bin/sign_update "$DMG_FILE" -f "$SPARKLE_KEY_FILE")
          # Extract the base64 signature from: sparkle:edSignature="..." length="..."
          SIGNATURE=$(echo "$RAW_SIGNATURE" | head -1 | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')

          # Clean up key file
          rm -f "$SPARKLE_KEY_FILE"
          trap - EXIT

          if [ -z "$SIGNATURE" ]; then
            echo "::error::sign_update produced no EdDSA signature for $DMG_FILE."
            exit 1
          fi

          # Update appcast.xml
          cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>SpeechDock Updates</title>
                  <link>https://github.com/yohasebe/speechdock</link>
                  <description>Most recent changes with links to updates.</description>
                  <language>en</language>
                  <item>
                      <title>Version ${VERSION}</title>
                      <pubDate>${PUB_DATE}</pubDate>
                      <sparkle:version>${VERSION}</sparkle:version>
                      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                      <enclosure
                          url="https://github.com/yohasebe/speechdock/releases/download/v${VERSION}/${DMG_FILE}"
                          sparkle:edSignature="${SIGNATURE}"
                          length="${DMG_SIZE}"
                          type="application/octet-stream"/>
                  </item>
              </channel>
          </rss>
          EOF

          echo "Signed DMG: $DMG_FILE"
          echo "Signature: $SIGNATURE"
          echo "Size: $DMG_SIZE bytes"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          DMG_FILE="SpeechDock-$(cat VERSION).dmg"
          gh release create "$TAG" "$DMG_FILE" --verify-tag --generate-notes

      - name: Verify the published DMG
        # The update feed and the cask must only point at a DMG that users can
        # download and that is byte-identical to the one signed above.
        run: |
          DMG_FILE="SpeechDock-$(cat VERSION).dmg"
          URL="https://github.com/yohasebe/speechdock/releases/download/v$(cat VERSION)/${DMG_FILE}"
          EXPECTED=$(shasum -a 256 "$DMG_FILE")
          EXPECTED=${EXPECTED%% *}
          if ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not hash $DMG_FILE."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/published.dmg" "$URL"; then
              ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/published.dmg")
              ACTUAL=${ACTUAL%% *}
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "Published DMG matches the signed DMG ($EXPECTED)."
                exit 0
              fi
              echo "::error::Published DMG differs from the signed DMG. Do not rerun this tag: bump VERSION and release a new version."
              exit 1
            fi
            [ "$attempt" -lt 5 ] && sleep 10
          done
          echo "::error::Published DMG is not downloadable at $URL."
          exit 1

      - name: Commit and push appcast.xml
        run: |
          # Commit on top of the current main, which may have moved past the tag.
          VERSION=$(cat VERSION)
          MAIN_DIR="$RUNNER_TEMP/main"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git worktree remove --force "$MAIN_DIR" 2>/dev/null || true
            git worktree add --detach "$MAIN_DIR" FETCH_HEAD
            # Never move the feed back to an older version than it already serves.
            CURRENT=$(sed -n 's/.*<sparkle:version>\(.*\)<\/sparkle:version>.*/\1/p' "$MAIN_DIR/appcast.xml" | head -1)
            if [ -z "$CURRENT" ]; then
              echo "::error::Could not read the version appcast.xml serves on main."
              exit 1
            fi
            NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
            if [ "$NEWEST" != "$VERSION" ]; then
              echo "::error::appcast.xml already serves $CURRENT, which is newer than $VERSION."
              exit 1
            fi
            cp appcast.xml "$MAIN_DIR/appcast.xml"
            git -C "$MAIN_DIR" config user.name "github-actions[bot]"
            git -C "$MAIN_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "$MAIN_DIR" add appcast.xml
            if git -C "$MAIN_DIR" diff --cached --quiet; then
              echo "appcast.xml on main already serves this release."
              exit 0
            fi
            git -C "$MAIN_DIR" commit -m "Update appcast.xml for v${VERSION}"
            if git -C "$MAIN_DIR" push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed; fetching main again before the next attempt."
          done
          echo "::error::Could not push appcast.xml to main."
          exit 1

      - name: Update Homebrew Cask
        id: homebrew
        # Do not fail the whole release if only the tap update fails — the DMG,
        # GitHub Release, and appcast are already published by this point. But
        # the outcome is surfaced by the "Verify Homebrew Cask update" step
        # below so a failure (e.g. an expired HOMEBREW_TAP_TOKEN) is never
        # silently swallowed.
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is empty or unset."
            exit 1
          fi
          VERSION=$(cat VERSION)
          DMG_FILE="SpeechDock-${VERSION}.dmg"
          SHA256=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')

          # Clone homebrew-speechdock repo
          # Pass the token via an HTTP header so it never appears in the
          # clone URL, remote config, or git error messages
          git clone https://github.com/yohasebe/homebrew-speechdock.git /tmp/homebrew-speechdock
          cd /tmp/homebrew-speechdock
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(echo -n "x-access-token:${HOMEBREW_TAP_TOKEN}" | base64)"

          # Never move the cask back to an older version than it already serves.
          CURRENT=$(sed -n 's/^ *version "\(.*\)"$/\1/p' Casks/speechdock.rb | head -1)
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read the version the cask serves."
            exit 1
          fi
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
          if [ "$NEWEST" != "$VERSION" ]; then
            echo "::notice::The cask already serves $CURRENT, which is newer than $VERSION. Nothing to update."
            exit 0
          fi

          # Update cask file
          cat > Casks/speechdock.rb << CASKEOF
          cask "speechdock" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/yohasebe/speechdock/releases/download/v#{version}/SpeechDock-#{version}.dmg"
            name "SpeechDock"
            desc "Menu bar STT/TTS app for macOS with multiple provider support"
            homepage "https://github.com/yohasebe/speechdock"

            depends_on macos: :sonoma

            app "SpeechDock.app"

            zap trash: [
              "~/Library/Preferences/com.speechdock.app.plist",
              "~/Library/Application Support/SpeechDock",
            ]
          end
          CASKEOF

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Casks/speechdock.rb

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/speechdock.rb
          if git diff --cached --quiet; then
            echo "The cask already serves this release."
            exit 0
          fi
          git commit -m "Update SpeechDock to v${VERSION}"
          git push

      - name: Verify Homebrew Cask update
        run: |
          if [ "${{ steps.homebrew.outcome }}" != "success" ]; then
            echo "::error::Homebrew Cask update FAILED (outcome: ${{ steps.homebrew.outcome }})."
            echo "The GitHub Release and appcast.xml were published, but the Homebrew tap"
            echo "(yohasebe/homebrew-speechdock) was NOT updated, so 'brew upgrade' users are"
            echo "stuck on the previous version. Most likely cause: an expired or invalid"
            echo "HOMEBREW_TAP_TOKEN secret. Regenerate the PAT (repo scope) and update the"
            echo "repository secret. Before editing Casks/speechdock.rb by hand, check the version"
            echo "and sha256 it serves now, and leave it alone if it is this release or newer."
            exit 1
          fi
          echo "Homebrew Cask updated successfully."

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

